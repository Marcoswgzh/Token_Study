# RQ2: medium-strength hex token with a realistic expiration-window attack
name: rq2_expiration_medium_hex
trials: 1000
attack_attempt_budget: 10000
attack_rate_per_second: 100
token_policy:
  length: 4
  alphabet: "0123456789ABCDEF"
  ttl_seconds: 5
  single_use: true
rate_limit_policy:
  enabled: false
  max_attempts: 999999
  window_seconds: 60
