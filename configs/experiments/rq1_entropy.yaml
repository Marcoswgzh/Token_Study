# RQ1: effect of token entropy under fixed attack budget
name: rq1_entropy_baseline
trials: 1000
attack_attempt_budget: 500
attack_rate_per_second: 10
token_policy:
  length: 4
  alphabet: "0123456789ABCDEF"
  ttl_seconds: 300
  single_use: true
rate_limit_policy:
  enabled: false
  max_attempts: 999999
  window_seconds: 60
