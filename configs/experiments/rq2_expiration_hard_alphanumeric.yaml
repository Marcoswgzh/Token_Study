# RQ2: high-entropy alphanumeric token with a high-rate expiration-window attack
name: rq2_expiration_hard_alphanumeric
trials: 1000
attack_attempt_budget: 10000
attack_rate_per_second: 1000
token_policy:
  length: 6
  alphabet: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  ttl_seconds: 10
  single_use: true
rate_limit_policy:
  enabled: false
  max_attempts: 999999
  window_seconds: 60
