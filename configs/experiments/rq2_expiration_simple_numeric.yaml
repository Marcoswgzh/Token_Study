# RQ2: intentionally weak numeric token with an aggressive expiration-window attack
name: rq2_expiration_simple_numeric
trials: 1000
attack_attempt_budget: 5000
attack_rate_per_second: 500
token_policy:
  length: 3
  alphabet: "0123456789"
  ttl_seconds: 10
  single_use: true
rate_limit_policy:
  enabled: false
  max_attempts: 999999
  window_seconds: 60
