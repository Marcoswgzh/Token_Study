# RQ2: expiration window attack - numeric alphabet, token length 4, TTL 30s
name: rq2_expiration_numeric_len4_ttl30
trials: 1000
attack_attempt_budget: 50000
attack_rate_per_second: 5000
token_policy:
  length: 4
  alphabet: "0123456789"
  ttl_seconds: 30
  single_use: true
rate_limit_policy:
  enabled: false
  max_attempts: 999999
  window_seconds: 60
