# RQ2: effect of token expiration time under fixed entropy + attack rate
name: rq2_expiration_baseline
trials: 1000
attack_attempt_budget: 500
attack_rate_per_second: 10
token_policy:
  length: 6
  alphabet: "0123456789ABCDEF"
  ttl_seconds: 60
  single_use: true
rate_limit_policy:
  enabled: false
  max_attempts: 999999
  window_seconds: 60
